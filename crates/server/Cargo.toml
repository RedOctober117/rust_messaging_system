[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
futures = "0.3.31"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
log = "0.4"
pretty_env_logger = "0.4"
tokio = { version = "1", features = ["full"] }
thiserror = "2"

[dependencies.async-std]
version = "1.13.0"
features = ["attributes"]
